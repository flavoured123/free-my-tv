# Builds FreeMyTV.apk for this fork and publishes it as the "latest" release, so the TV can download it from one fixed
# address: https://github.com/<you>/free-my-tv/releases/download/latest/FreeMyTV.apk
#
# Secrets (repo Settings → Secrets and variables → Actions → New repository secret):
#   TMDB_KEY  your free TMDB key (the trending picks)
#   KEYSTORE  freemytv.keystore in base64; updates must be signed with the same key, so set it once and keep it
# Variables (same page, Variables tab), all optional: TMDB_REGION (DE), CITY, LATITUDE, LONGITUDE, LANGUAGE.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "build.sh", ".github/workflows/apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Settings
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          TMDB_REGION: ${{ vars.TMDB_REGION || 'DE' }}
          CITY: ${{ vars.CITY || 'Wetter' }}
          LATITUDE: ${{ vars.LATITUDE || '51.388' }}
          LONGITUDE: ${{ vars.LONGITUDE || '7.395' }}
          LANGUAGE: ${{ vars.LANGUAGE || 'auto' }}
        run: |
          cp config.example.properties config.properties
          set_prop() { sed -i "s|^$1=.*|$1=$2|" config.properties; }
          set_prop tmdb_key "$TMDB_KEY"
          set_prop tmdb_region "$TMDB_REGION"
          set_prop city "$CITY"
          set_prop latitude "$LATITUDE"
          set_prop longitude "$LONGITUDE"
          set_prop language "$LANGUAGE"
          set_prop currency EUR
          set_prop temperature C
          set_prop show_crypto false
          [ -n "$TMDB_KEY" ] || echo "::warning::No TMDB_KEY secret: the app builds, but without the trending picks."
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > freemytv.keystore
          else echo "::warning::No KEYSTORE secret: this build has a new key, so it won't install over an earlier one."; fi
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: FreeMyTV.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest FreeMyTV.apk --title "Latest build" --notes "Built from ${GITHUB_SHA::7}" --latest
