name: Probe sports APIs
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          get() { curl -sS -m 20 -A "Mozilla/5.0" -o "$1.json" -w "$1 %{http_code} %{size_download}\n" "$2" >> ../status.txt || echo "$1 FAIL" >> ../status.txt; }
          get atp "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard"
          get wta "https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard"
          get ucl_day "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard?dates=$(date -u -d '+4 day' +%Y%m%d)"
          get nations "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.friendly/scoreboard?dates=$(date -u -d '+18 day' +%Y%m%d)"
      - run: |
          git init -q pub && cd pub && mv ../out data && mv ../status.txt .
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git checkout -q -b probe-data && git add -A && git commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
